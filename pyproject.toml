[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-reconstruction"
version = "0.1.0"
description = "Probabilistic trajectory reconstruction on a road network from sparse, noisy GPS observations. Outputs a calibrated set of feasible paths plus dwell-aware annotations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Undraa Maa" }]
keywords = ["map-matching", "trajectory-reconstruction", "gps", "road-network", "crf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.13",
    "shapely>=2.0",
    "networkx>=3.2",
    "osmium>=3.6",
    "matplotlib>=3.8",
    "folium>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["archive*", "tests*", "scripts*", "cache*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
